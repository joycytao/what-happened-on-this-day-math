<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">21</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Edison tests a long-lasting lamp</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 21?</text><text data-content="body" x="155" y="864" font-size="34">How long would you want a lamp to stay lit during a power cut? Thomas</text>
<text data-content="body" x="155" y="906" font-size="34">Edison demonstrated a practical incandescent lamp that stayed lit for</text>
<text data-content="body" x="155" y="948" font-size="34">many hours in October 1879. A lamp that lasted longer was useful</text>
<text data-content="body" x="155" y="990" font-size="34">because people did not need to replace it quickly. Early inventors tested</text>
<text data-content="body" x="155" y="1032" font-size="34">materials again and again. A bright idea was only useful when the lamp</text>
<text data-content="body" x="155" y="1074" font-size="34">could be made, turned on, and kept working safely. Imagine comparing</text>
<text data-content="body" x="155" y="1116" font-size="34">an old test with a modern energy-saving bulb. The practice numbers</text>
<text data-content="body" x="155" y="1158" font-size="34">include 13 hours, two bulbs, 10 watts for each of six bulbs, five hours,</text>
<text data-content="body" x="155" y="1200" font-size="34">15,000 hours, ten hours each day, and 365 days each year. History gives</text>
<text data-content="body" x="155" y="1242" font-size="34">us the date and the main event; the rest of the scene helps us imagine</text>
<text data-content="body" x="155" y="1284" font-size="34">the people who saw it. Keep one question in mind while you read. The</text>
<text data-content="body" x="155" y="1326" font-size="34">clearest answer begins with a careful look at the evidence. Readers can</text>
<text data-content="body" x="155" y="1368" font-size="34">pause, point to a clue, and explain its meaning. The calendar places this</text>
<text data-content="body" x="155" y="1410" font-size="34">moment in October, a month full of different stories.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
