  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">6</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Moulin Rouge opens</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 6?</text><text data-content="body" x="155" y="864" font-size="34">What would you notice first if a theater had a giant windmill outside? The</text>
<text data-content="body" x="155" y="906" font-size="34">Moulin Rouge opened in Paris on October 6, 1889. Its famous red</text>
<text data-content="body" x="155" y="948" font-size="34">windmill became a sign that people could recognize from far away. The</text>
<text data-content="body" x="155" y="990" font-size="34">theater opened in Paris with its windmill placed high above the building,</text>
<text data-content="body" x="155" y="1032" font-size="34">making the entrance easy for visitors to spot. A theater is more than a</text>
<text data-content="body" x="155" y="1074" font-size="34">building with seats. It is also a place where lights, music, costumes,</text>
<text data-content="body" x="155" y="1116" font-size="34">dancers, and an audience meet for one show. The windmill helped</text>
<text data-content="body" x="155" y="1158" font-size="34">people recognize the Moulin Rouge from a distance. Inside, performers</text>
<text data-content="body" x="155" y="1200" font-size="34">and musicians made the theater lively. The building became famous not</text>
<text data-content="body" x="155" y="1242" font-size="34">only because of its shows, but also because its bold sign stood out in</text>
<text data-content="body" x="155" y="1284" font-size="34">Paris. The bright windmill became a symbol of the theater. It helped turn</text>
<text data-content="body" x="155" y="1326" font-size="34">a building in Paris into a place recognized by people far beyond its</text>
<text data-content="body" x="155" y="1368" font-size="34">neighborhood. A theater can become part of a city&apos;s memory when its</text>
<text data-content="body" x="155" y="1410" font-size="34">building, performances, and visitors keep returning to the same lively</text>
<text data-content="body" x="155" y="1452" font-size="34">place.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
