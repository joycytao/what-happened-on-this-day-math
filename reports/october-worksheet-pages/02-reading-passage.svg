<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">2</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Peanuts appears in newspapers</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">A few newspaper panels gave Peanuts room to make ordinary school</text>
<text data-content="article" x="155" y="786" font-size="34" font-weight="600">days funny.</text><text data-content="body" x="155" y="906" font-size="34">What can a comic strip show with only a few boxes and some drawings?</text>
<text data-content="body" x="155" y="948" font-size="34">On October 2, 1950, Charles Schulz&apos;s Peanuts first appeared in</text>
<text data-content="body" x="155" y="990" font-size="34">newspapers. Readers met characters who could make an ordinary school</text>
<text data-content="body" x="155" y="1032" font-size="34">day feel funny, surprising, or a little awkward. Schulz drew the first strip</text>
<text data-content="body" x="155" y="1074" font-size="34">for a newspaper page, where a few panels had to carry the action and the</text>
<text data-content="body" x="155" y="1116" font-size="34">joke. A comic strip has to choose its words carefully because each panel</text>
<text data-content="body" x="155" y="1158" font-size="34">has limited space. A small picture can show a big feeling, and a short line</text>
<text data-content="body" x="155" y="1200" font-size="34">can make a reader laugh. Schulz kept drawing the characters after that</text>
<text data-content="body" x="155" y="1242" font-size="34">first appearance, and readers returned to see what happened next. A</text>
<text data-content="body" x="155" y="1284" font-size="34">newspaper comic may look small, but its characters can stay with people</text>
<text data-content="body" x="155" y="1326" font-size="34">for many years. Peanuts began with a few panels and became part of</text>
<text data-content="body" x="155" y="1368" font-size="34">daily reading. The first newspaper appearance was brief, but the</text>
<text data-content="body" x="155" y="1410" font-size="34">characters returned again and again. Their ordinary problems helped</text>
<text data-content="body" x="155" y="1452" font-size="34">readers recognize pieces of their own lives. Each new strip gave Schulz</text>
<text data-content="body" x="155" y="1494" font-size="34">another chance to show a small feeling, and those small feelings helped</text>
<text data-content="body" x="155" y="1536" font-size="34">the comic speak to many readers.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
</svg>
