  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">16</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Disney Brothers Cartoon Studio begins</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 16?</text><text data-content="body" x="155" y="864" font-size="34">What could two brothers make with drawings, patience, and a small</text>
<text data-content="body" x="155" y="906" font-size="34">studio? On October 16, 1923, Walt and Roy Disney signed a contract that</text>
<text data-content="body" x="155" y="948" font-size="34">began their cartoon studio story. Their work grew from drawings and</text>
<text data-content="body" x="155" y="990" font-size="34">teamwork. Animation takes many drawings because a moving picture is</text>
<text data-content="body" x="155" y="1032" font-size="34">made from images shown in order. Artists repeat a motion carefully so a</text>
<text data-content="body" x="155" y="1074" font-size="34">character appears to walk, wave, or smile. A contract is not the same as</text>
<text data-content="body" x="155" y="1116" font-size="34">a finished cartoon, but it marked the beginning of a studio that would</text>
<text data-content="body" x="155" y="1158" font-size="34">grow. Walt and Roy Disney still needed drawings, stories, workers, and</text>
<text data-content="body" x="155" y="1200" font-size="34">many experiments. Their first agreement was one early step in that work.</text>
<text data-content="body" x="155" y="1242" font-size="34">The contract was only a beginning. Drawings, stories, music, and</text>
<text data-content="body" x="155" y="1284" font-size="34">teamwork would be needed before an idea on paper could become a</text>
<text data-content="body" x="155" y="1326" font-size="34">finished cartoon. A studio begins with people who choose to work</text>
<text data-content="body" x="155" y="1368" font-size="34">together. The drawings matter, but so do the agreements that let the work</text>
<text data-content="body" x="155" y="1410" font-size="34">continue.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
