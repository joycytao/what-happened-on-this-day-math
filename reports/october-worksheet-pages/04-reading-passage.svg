<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">4</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Sputnik beeps from space</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 4?</text><text data-content="body" x="155" y="864" font-size="34">If you heard a tiny beep from the sky, what would you guess was making</text>
<text data-content="body" x="155" y="906" font-size="34">it? On October 4, 1957, Sputnik 1 became the first artificial satellite to</text>
<text data-content="body" x="155" y="948" font-size="34">orbit Earth. It was a small metal spacecraft with antennas that sent beeps</text>
<text data-content="body" x="155" y="990" font-size="34">back to ground stations. Sputnik traveled around Earth after Soviet</text>
<text data-content="body" x="155" y="1032" font-size="34">engineers launched it into orbit, while radio stations on the ground</text>
<text data-content="body" x="155" y="1074" font-size="34">listened for its signal. People on Earth could listen for the signal even</text>
<text data-content="body" x="155" y="1116" font-size="34">though Sputnik was far above them. The beeps showed that an object</text>
<text data-content="body" x="155" y="1158" font-size="34">made by people was traveling around the planet. Sputnik did not carry</text>
<text data-content="body" x="155" y="1200" font-size="34">people, but it changed what people believed was possible above Earth.</text>
<text data-content="body" x="155" y="1242" font-size="34">Its signal crossed the distance between the satellite and listeners on the</text>
<text data-content="body" x="155" y="1284" font-size="34">ground. A few beeps became a clear sign that a new space age had</text>
<text data-content="body" x="155" y="1326" font-size="34">begun. The beeps were simple, yet they carried across space. People on</text>
<text data-content="body" x="155" y="1368" font-size="34">the ground heard evidence that a human-made object was circling Earth.</text>
<text data-content="body" x="155" y="1410" font-size="34">Space looked empty, but the signal proved that careful planning had sent</text>
<text data-content="body" x="155" y="1452" font-size="34">a real object through it and brought information back home.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
</svg>
