    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">20</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">The first World Statistics Day</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">Careful counting helps people understand what numbers really show.</text><text data-content="body" x="155" y="864" font-size="34">How can numbers help us notice what is happening in a group? World</text>
<text data-content="body" x="155" y="906" font-size="34">Statistics Day was first celebrated worldwide on October 20, 2010.</text>
<text data-content="body" x="155" y="948" font-size="34">Statistics are numbers collected and organized so people can look for</text>
<text data-content="body" x="155" y="990" font-size="34">patterns. The international day uses careful counting and shared</text>
<text data-content="body" x="155" y="1032" font-size="34">definitions so people in different places can compare information fairly. A</text>
<text data-content="body" x="155" y="1074" font-size="34">number alone does not answer every question. We also need to know</text>
<text data-content="body" x="155" y="1116" font-size="34">what was counted, when it was counted, and whether the way of counting</text>
<text data-content="body" x="155" y="1158" font-size="34">was fair. A statistic needs a clear question behind it. If people count</text>
<text data-content="body" x="155" y="1200" font-size="34">different things or use different rules, the numbers can mislead. World</text>
<text data-content="body" x="155" y="1242" font-size="34">Statistics Day highlights the careful work needed to collect, check, and</text>
<text data-content="body" x="155" y="1284" font-size="34">explain information. Reliable statistics help people describe change</text>
<text data-content="body" x="155" y="1326" font-size="34">without guessing. The counting method matters because a number is</text>
<text data-content="body" x="155" y="1368" font-size="34">only useful when everyone understands what it represents. Statistics can</text>
<text data-content="body" x="155" y="1410" font-size="34">support good decisions only when the collection is honest, the categories</text>
<text data-content="body" x="155" y="1452" font-size="34">are clear, and the people reading the result understand its limits for</text>
<text data-content="body" x="155" y="1494" font-size="34">everyone to use.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
