<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">28</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">The Statue of Liberty is dedicated</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 28?</text><text data-content="body" x="155" y="864" font-size="34">What might you see first when a statue stands at the entrance to a</text>
<text data-content="body" x="155" y="906" font-size="34">harbor? The Statue of Liberty was dedicated in New York Harbor on</text>
<text data-content="body" x="155" y="948" font-size="34">October 28, 1886. The statue became a landmark that many arriving</text>
<text data-content="body" x="155" y="990" font-size="34">visitors could see. The statue stands on an island in New York Harbor,</text>
<text data-content="body" x="155" y="1032" font-size="34">where ships and visitors can see its torch above the water. A landmark</text>
<text data-content="body" x="155" y="1074" font-size="34">can carry an idea as well as stand in a place. People may connect the</text>
<text data-content="body" x="155" y="1116" font-size="34">statue with welcome, hope, and the journeys of families who arrived by</text>
<text data-content="body" x="155" y="1158" font-size="34">sea. The statue was a gift from France and became a landmark in New</text>
<text data-content="body" x="155" y="1200" font-size="34">York Harbor. People arriving by ship could see it before reaching the city.</text>
<text data-content="body" x="155" y="1242" font-size="34">Its raised torch and welcoming position made it a powerful part of the</text>
<text data-content="body" x="155" y="1284" font-size="34">harbor view. The statue became part of the harbor view for people</text>
<text data-content="body" x="155" y="1326" font-size="34">arriving by ship. Its torch and welcoming position gave the landmark a</text>
<text data-content="body" x="155" y="1368" font-size="34">meaning beyond its size. Landmarks collect stories from many visitors.</text>
<text data-content="body" x="155" y="1410" font-size="34">The statue stayed in one harbor while the people looking at it came from</text>
<text data-content="body" x="155" y="1452" font-size="34">many different places.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
</svg>
