  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">15</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Clean hands get a special day</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 15?</text><text data-content="body" x="155" y="864" font-size="34">How long do you spend washing your hands before eating? The first</text>
<text data-content="body" x="155" y="906" font-size="34">Global Handwashing Day was held on October 15, 2008. It taught that</text>
<text data-content="body" x="155" y="948" font-size="34">soap and water can help remove germs and prevent illness. A useful</text>
<text data-content="body" x="155" y="990" font-size="34">habit is made from a small action repeated at the right time. Rubbing</text>
<text data-content="body" x="155" y="1032" font-size="34">hands, rinsing, and drying may feel ordinary, but those steps can protect</text>
<text data-content="body" x="155" y="1074" font-size="34">a whole classroom. Handwashing is easy to overlook because it takes</text>
<text data-content="body" x="155" y="1116" font-size="34">only a short time. The day gives schools a reason to practice the steps</text>
<text data-content="body" x="155" y="1158" font-size="34">together. Soap, water, and a little patience can turn a simple routine into</text>
<text data-content="body" x="155" y="1200" font-size="34">useful protection. Clean hands are a small defense against illness. A</text>
<text data-content="body" x="155" y="1242" font-size="34">shared reminder can help many people repeat the habit at home, at</text>
<text data-content="body" x="155" y="1284" font-size="34">school, and in public places. The lesson travels farther than one</text>
<text data-content="body" x="155" y="1326" font-size="34">classroom because children can carry the habit to their families and make</text>
<text data-content="body" x="155" y="1368" font-size="34">clean hands part of daily life.</text>
    </g>
  </g>
