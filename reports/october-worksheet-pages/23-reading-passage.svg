    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">23</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Pelé is born</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 23?</text><text data-content="body" x="155" y="864" font-size="34">What can a player learn by passing the ball instead of keeping it? Pelé</text>
<text data-content="body" x="155" y="906" font-size="34">was born on October 23, 1940, and became one of football&apos;s most</text>
<text data-content="body" x="155" y="948" font-size="34">famous players. His career included goals, matches, practice, and</text>
<text data-content="body" x="155" y="990" font-size="34">teamwork. Pelé played on football fields in Brazil and around the world,</text>
<text data-content="body" x="155" y="1032" font-size="34">using practice and quick decisions to help his team attack. A great player</text>
<text data-content="body" x="155" y="1074" font-size="34">does not work alone. Teammates watch the field, move into space, and</text>
<text data-content="body" x="155" y="1116" font-size="34">make choices quickly while the game keeps changing. Pelé&apos;s skill made</text>
<text data-content="body" x="155" y="1158" font-size="34">him famous, but football is played with teammates and opponents on the</text>
<text data-content="body" x="155" y="1200" font-size="34">same field. A player must practice, notice openings, and make quick</text>
<text data-content="body" x="155" y="1242" font-size="34">choices. His life is remembered through the goals and matches that</text>
<text data-content="body" x="155" y="1284" font-size="34">shaped his career. Pelé&apos;s career joined skill with practice and teamwork.</text>
<text data-content="body" x="155" y="1326" font-size="34">His goals are part of the record, but the people on the field helped make</text>
<text data-content="body" x="155" y="1368" font-size="34">each match possible. A match is remembered in goals, but a career also</text>
<text data-content="body" x="155" y="1410" font-size="34">contains practice, travel, teamwork, and choices made when no camera</text>
<text data-content="body" x="155" y="1452" font-size="34">is watching over many seasons.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
