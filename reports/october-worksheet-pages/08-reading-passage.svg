    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">8</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Octopus Day</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 8?</text><text data-content="body" x="155" y="864" font-size="34">How would you solve a puzzle if you had eight arms to use on an October</text>
<text data-content="body" x="155" y="906" font-size="34">day? World Octopus Day celebrates an animal with eight arms.</text>
<text data-content="body" x="155" y="948" font-size="34">Octopuses can use their arms to explore, hold food, and investigate</text>
<text data-content="body" x="155" y="990" font-size="34">objects around them. An octopus does not need to look like a person to</text>
<text data-content="body" x="155" y="1032" font-size="34">be a clever problem solver. It can learn from what it touches and change</text>
<text data-content="body" x="155" y="1074" font-size="34">its actions when a puzzle changes. An octopus can change color,</text>
<text data-content="body" x="155" y="1116" font-size="34">squeeze through narrow spaces, and use its arms in different ways.</text>
<text data-content="body" x="155" y="1158" font-size="34">Scientists watch these animals because their actions can reveal how they</text>
<text data-content="body" x="155" y="1200" font-size="34">learn. World Octopus Day celebrates their unusual bodies without</text>
<text data-content="body" x="155" y="1242" font-size="34">pretending that they think exactly like people. The animal&apos;s unusual body</text>
<text data-content="body" x="155" y="1284" font-size="34">is the heart of the celebration. Its arms, colors, and problem-solving skills</text>
<text data-content="body" x="155" y="1326" font-size="34">make the octopus unlike almost any other sea animal. An octopus</text>
<text data-content="body" x="155" y="1368" font-size="34">reminds us that intelligence can appear in many forms, including bodies</text>
<text data-content="body" x="155" y="1410" font-size="34">and ways of solving problems that are different from our own.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
