  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">8</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Cephalopod Awareness Days begin</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What could you explore if you had eight arms and a puzzle to solve?</text><text data-content="body" x="155" y="864" font-size="34">What could you explore if you had eight arms and a puzzle to solve?</text>
<text data-content="body" x="155" y="906" font-size="34">NOAA&apos;s Cephalopod Awareness Days begin on October 8 and celebrate</text>
<text data-content="body" x="155" y="948" font-size="34">fascinating ocean animals. NOAA explains that octopuses have eight</text>
<text data-content="body" x="155" y="990" font-size="34">arms and no tentacles. Their arms have suckers that help them sense the</text>
<text data-content="body" x="155" y="1032" font-size="34">world around them. An octopus can use its arms to explore and</text>
<text data-content="body" x="155" y="1074" font-size="34">manipulate objects, much like a child testing how a puzzle piece fits.</text>
<text data-content="body" x="155" y="1116" font-size="34">NOAA educators describe octopuses as intelligent animals and explain</text>
<text data-content="body" x="155" y="1158" font-size="34">that one octopus named Pi learned to open jars and work with food</text>
<text data-content="body" x="155" y="1200" font-size="34">puzzles. That does not mean an octopus thinks exactly like a person. It</text>
<text data-content="body" x="155" y="1242" font-size="34">means animals can solve problems in ways that fit their bodies and</text>
<text data-content="body" x="155" y="1284" font-size="34">habitats. Octopuses can also change color, crawl across the sea floor,</text>
<text data-content="body" x="155" y="1326" font-size="34">and squeeze into small spaces. On October 8, the observance gives us a</text>
<text data-content="body" x="155" y="1368" font-size="34">reason to notice these unusual animals and ask how scientists learn from</text>
<text data-content="body" x="155" y="1410" font-size="34">them. The next time you see a puzzle, imagine having eight helpful arms</text>
<text data-content="body" x="155" y="1452" font-size="34">ready to investigate it.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
