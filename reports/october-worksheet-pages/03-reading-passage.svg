<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">3</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Transistor inventors receive a patent</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 3?</text><text data-content="body" x="155" y="864" font-size="34">Have you ever opened a small electronic device and wondered what</text>
<text data-content="body" x="155" y="906" font-size="34">makes it work? On October 3, 1950, the inventors of the transistor</text>
<text data-content="body" x="155" y="948" font-size="34">received a patent. A transistor is a tiny part that can control an electric</text>
<text data-content="body" x="155" y="990" font-size="34">signal. The inventors developed the transistor at Bell Telephone</text>
<text data-content="body" x="155" y="1032" font-size="34">Laboratories, where engineers needed a smaller way to control signals.</text>
<text data-content="body" x="155" y="1074" font-size="34">The transistor helped lead to smaller and more useful electronics. A</text>
<text data-content="body" x="155" y="1116" font-size="34">radio, computer, or phone may contain many parts that are hard to see,</text>
<text data-content="body" x="155" y="1158" font-size="34">yet each one can have an important job. The patent did not make every</text>
<text data-content="body" x="155" y="1200" font-size="34">electronic problem disappear. It recorded an idea that other engineers</text>
<text data-content="body" x="155" y="1242" font-size="34">could study and improve. A tiny component may be easy to overlook, yet</text>
<text data-content="body" x="155" y="1284" font-size="34">the transistor became an important part of the story of modern</text>
<text data-content="body" x="155" y="1326" font-size="34">electronics. The patent recorded a useful idea at one point in time. Later</text>
<text data-content="body" x="155" y="1368" font-size="34">inventors built on that idea, helping electronic devices become smaller</text>
<text data-content="body" x="155" y="1410" font-size="34">and more powerful. The transistor&apos;s story shows how a part that is too</text>
<text data-content="body" x="155" y="1452" font-size="34">small to notice can still help change the way people communicate and</text>
<text data-content="body" x="155" y="1494" font-size="34">work.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
