<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">1</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text x="155" y="670" font-size="34" font-weight="700">The Model T reaches its first customer</text><text x="155" y="744" font-size="34" font-weight="600">What clue would you notice first on October 1?</text><text data-content="body" x="155" y="864" font-size="34">Have you ever found a surprising story hiding on an ordinary calendar</text>
<text data-content="body" x="155" y="906" font-size="34">day? On <tspan font-weight="700">October 1</tspan> , Ford&apos;s Model T was shipped to its first customer on</text>
<text data-content="body" x="155" y="948" font-size="34">October 1, 1908, helping make car travel more affordable for many</text>
<text data-content="body" x="155" y="990" font-size="34">families. The memorable event belongs to <tspan font-weight="700">1908</tspan> , a year that helps us</text>
<text data-content="body" x="155" y="1032" font-size="34">place the story on a long timeline. Imagine opening a classroom history</text>
<text data-content="body" x="155" y="1074" font-size="34">box and finding this clue inside: <tspan font-weight="700">The Model T reaches its first customer</tspan></text>
<text data-content="body" x="155" y="1116" font-size="34">. The interesting part is not just a name or a date. It is the</text>
<text data-content="body" x="155" y="1158" font-size="34">human-sized problem behind the clue. People had to notice something</text>
<text data-content="body" x="155" y="1200" font-size="34">unusual, try an idea, solve a puzzle, or face a challenge. That makes</text>
<text data-content="body" x="155" y="1242" font-size="34">the event easier to remember than a list of facts. In our story, the</text>
<text data-content="body" x="155" y="1284" font-size="34">number <tspan font-weight="700">1</tspan> marks the October day, and the number <tspan font-weight="700">2</tspan> gives us two pretend</text>
<text data-content="body" x="155" y="1326" font-size="34">teammates to help investigate. We can also use cards numbered <tspan font-weight="700">1</tspan> , <tspan font-weight="700">2</tspan> , <tspan font-weight="700">3</tspan></text>
<text data-content="body" x="155" y="1368" font-size="34">, <tspan font-weight="700">4</tspan> , and <tspan font-weight="700">5</tspan> , plus <tspan font-weight="700">12</tspan> months in one calendar year. Those numbers turn</text>
<text data-content="body" x="155" y="1410" font-size="34">reading into a small math adventure. A source from <tspan font-weight="700">Ford Motor Company</tspan></text>
<text data-content="body" x="155" y="1452" font-size="34">preserves the evidence, while our classroom version uses simple language</text>
<text data-content="body" x="155" y="1494" font-size="34">and avoids scary details. After reading, ask what you would notice</text>
<text data-content="body" x="155" y="1536" font-size="34">first, what tool you would choose, and whether your first idea would</text>
<text data-content="body" x="155" y="1578" font-size="34">work. History often rewards curious people who keep looking when the</text>
<text data-content="body" x="155" y="1620" font-size="34">answer is not obvious.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
</svg>
