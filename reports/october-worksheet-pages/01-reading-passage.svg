<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">1</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">The Model T reaches its first customer</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 1?</text><text data-content="body" x="155" y="864" font-size="34">Have you ever seen a car and wondered how many small parts help it</text>
<text data-content="body" x="155" y="906" font-size="34">move? On October 1, 1908, a Ford Model T was shipped to its first</text>
<text data-content="body" x="155" y="948" font-size="34">customer. The car was not a magic machine; it was a careful collection of</text>
<text data-content="body" x="155" y="990" font-size="34">metal, glass, rubber, and moving pieces. The Model T mattered because</text>
<text data-content="body" x="155" y="1032" font-size="34">Ford worked to make car travel more affordable for many families. That</text>
<text data-content="body" x="155" y="1074" font-size="34">change did not happen in one afternoon, but one first customer made the</text>
<text data-content="body" x="155" y="1116" font-size="34">date memorable. The first customer did not see every future change that</text>
<text data-content="body" x="155" y="1158" font-size="34">the car would bring. Still, one Model T leaving the factory showed how an</text>
<text data-content="body" x="155" y="1200" font-size="34">invention can move from a plan on paper into an ordinary person&apos;s life.</text>
<text data-content="body" x="155" y="1242" font-size="34">That is why this small October delivery is worth remembering. The car&apos;s</text>
<text data-content="body" x="155" y="1284" font-size="34">arrival was one small moment in the long history of travel. It showed how</text>
<text data-content="body" x="155" y="1326" font-size="34">a new machine could leave a factory and become part of family life. The</text>
<text data-content="body" x="155" y="1368" font-size="34">Model T story is therefore about more than a car: it is about an invention</text>
<text data-content="body" x="155" y="1410" font-size="34">becoming useful to people outside the workshop.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
