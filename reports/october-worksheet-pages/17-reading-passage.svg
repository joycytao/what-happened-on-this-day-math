<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">17</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Small actions can help communities</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">Communities can make help easier to reach when they listen and</text>
<text data-content="article" x="155" y="786" font-size="34" font-weight="600">organize.</text><text data-content="body" x="155" y="906" font-size="34">What small action could make a neighbor&apos;s day easier? October 17 is a</text>
<text data-content="body" x="155" y="948" font-size="34">day for learning how communities can work together to reduce poverty.</text>
<text data-content="body" x="155" y="990" font-size="34">The focus is on people, resources, and practical help rather than one</text>
<text data-content="body" x="155" y="1032" font-size="34">single invention. The observance takes place in communities where</text>
<text data-content="body" x="155" y="1074" font-size="34">people and organizations discuss practical ways to remove barriers and</text>
<text data-content="body" x="155" y="1116" font-size="34">share resources. A community can share food, teach a skill, repair a</text>
<text data-content="body" x="155" y="1158" font-size="34">home, or listen to a family. These actions do not make every challenge</text>
<text data-content="body" x="155" y="1200" font-size="34">disappear, but they can make help easier to reach. The day asks people</text>
<text data-content="body" x="155" y="1242" font-size="34">to look at poverty as a problem that affects real neighbors, not as a</text>
<text data-content="body" x="155" y="1284" font-size="34">distant number. Communities can listen to what families need and share</text>
<text data-content="body" x="155" y="1326" font-size="34">power, time, food, or knowledge. Small actions matter more when people</text>
<text data-content="body" x="155" y="1368" font-size="34">organize them together. Reducing poverty takes more than one kind</text>
<text data-content="body" x="155" y="1410" font-size="34">gesture. It depends on people listening, sharing resources, and changing</text>
<text data-content="body" x="155" y="1452" font-size="34">systems that make daily life harder. A community becomes stronger when</text>
<text data-content="body" x="155" y="1494" font-size="34">help is planned with the people who need it, instead of being designed</text>
<text data-content="body" x="155" y="1536" font-size="34">without listening to them.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
