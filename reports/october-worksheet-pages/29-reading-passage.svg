<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">29</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">The first ARPANET message begins with “LO”</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 29?</text><text data-content="body" x="155" y="864" font-size="34">What is the shortest message you could send to show that a connection</text>
<text data-content="body" x="155" y="906" font-size="34">works? On October 29, 1969, a UCLA team began sending a message</text>
<text data-content="body" x="155" y="948" font-size="34">toward the Stanford Research Institute through ARPANET. The system</text>
<text data-content="body" x="155" y="990" font-size="34">stopped after the letters LO. Engineers connected two computers in</text>
<text data-content="body" x="155" y="1032" font-size="34">California and sent the first letters across the new network before the</text>
<text data-content="body" x="155" y="1074" font-size="34">system stopped. The unfinished message was still useful because it</text>
<text data-content="body" x="155" y="1116" font-size="34">showed that the connection had started. Later networks grew from many</text>
<text data-content="body" x="155" y="1158" font-size="34">tests, repairs, and careful improvements. The system stopping after LO</text>
<text data-content="body" x="155" y="1200" font-size="34">was not the end of the project. It showed that the first connection had</text>
<text data-content="body" x="155" y="1242" font-size="34">begun, and engineers could study what went wrong before trying again.</text>
<text data-content="body" x="155" y="1284" font-size="34">Early networks grew through tests, mistakes, and careful repairs. The</text>
<text data-content="body" x="155" y="1326" font-size="34">letters LO marked a beginning even though the message stopped early.</text>
<text data-content="body" x="155" y="1368" font-size="34">Engineers could use the failed attempt to repair the system and try again.</text>
<text data-content="body" x="155" y="1410" font-size="34">The first network message was tiny, but later connections depended on</text>
<text data-content="body" x="155" y="1452" font-size="34">beginnings like this one. A short test can lead to a much larger system.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
</svg>
