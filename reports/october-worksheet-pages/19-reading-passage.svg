    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">19</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Repair instead of replace</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 19?</text><text data-content="body" x="155" y="864" font-size="34">What object would you fix instead of throwing away on an October repair</text>
<text data-content="body" x="155" y="906" font-size="34">day? Repair events encourage people to fix useful objects rather than</text>
<text data-content="body" x="155" y="948" font-size="34">replace them. A loose button, a broken lamp, or a bicycle chain may need</text>
<text data-content="body" x="155" y="990" font-size="34">patience more than a new purchase. Repairers work in homes, shops,</text>
<text data-content="body" x="155" y="1032" font-size="34">and community spaces, where they inspect an object, find the broken</text>
<text data-content="body" x="155" y="1074" font-size="34">part, and make it useful again. Repairing also teaches people to look</text>
<text data-content="body" x="155" y="1116" font-size="34">closely. First find the problem, then choose a safe tool, make one</text>
<text data-content="body" x="155" y="1158" font-size="34">change, and test the object again. Repairing an object can save materials</text>
<text data-content="body" x="155" y="1200" font-size="34">and teach a useful skill. It can also bring neighbors together around a</text>
<text data-content="body" x="155" y="1242" font-size="34">table. A repaired lamp or bicycle may not look brand new, but it can keep</text>
<text data-content="body" x="155" y="1284" font-size="34">doing its job instead of becoming waste. A repaired object keeps its</text>
<text data-content="body" x="155" y="1326" font-size="34">earlier story while becoming useful again. Repair work can save materials</text>
<text data-content="body" x="155" y="1368" font-size="34">and give people a reason to learn from one another. Repair culture</text>
<text data-content="body" x="155" y="1410" font-size="34">values care for objects and care for resources. It asks what can be saved</text>
<text data-content="body" x="155" y="1452" font-size="34">before a useful thing is thrown away.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
