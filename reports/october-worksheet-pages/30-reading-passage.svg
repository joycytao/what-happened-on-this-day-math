<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" data-template-variant="reading-passage" data-template-version="1.0.0">
  <rect width="1545" height="2000" fill="#faf8f8"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">OCT</text>
    <text x="772" y="482" font-size="66" font-weight="700">30</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">A radio drama sounds like news</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What clue would you check first on October 30?</text><text data-content="body" x="155" y="864" font-size="34">How could a radio story sound so real that someone mistakes it for</text>
<text data-content="body" x="155" y="906" font-size="34">news? Orson Welles&apos;s radio adaptation of The War of the Worlds aired on</text>
<text data-content="body" x="155" y="948" font-size="34">October 30, 1938. Some listeners mistook parts of the fictional broadcast</text>
<text data-content="body" x="155" y="990" font-size="34">for real news. Radio gives listeners only sound, so music, voices, and</text>
<text data-content="body" x="155" y="1032" font-size="34">timing can create a strong picture in the mind. A careful listener should</text>
<text data-content="body" x="155" y="1074" font-size="34">check the source before believing a surprising report. Imagine a class</text>
<text data-content="body" x="155" y="1116" font-size="34">separating the story from the facts about the broadcast. Today&apos;s practice</text>
<text data-content="body" x="155" y="1158" font-size="34">numbers include six listeners and five neighbors, a 60-minute drama, 20</text>
<text data-content="body" x="155" y="1200" font-size="34">minutes of music, 6,000,000 listeners, 1,200,000 who panicked, and 100</text>
<text data-content="body" x="155" y="1242" font-size="34">percent. The facts are small clues, not a complete picture, so read slowly</text>
<text data-content="body" x="155" y="1284" font-size="34">and notice which details are stated and which are classroom practice.</text>
<text data-content="body" x="155" y="1326" font-size="34">That habit helps careful readers. The clearest answer begins with a</text>
<text data-content="body" x="155" y="1368" font-size="34">careful look at the evidence. Readers can pause, point to a clue, and</text>
<text data-content="body" x="155" y="1410" font-size="34">explain its meaning. The calendar places this moment in October, a</text>
<text data-content="body" x="155" y="1452" font-size="34">month full of different stories.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
    <g transform="translate(1305 1710)" fill="none" stroke="#f18a5b" stroke-width="6">
      <path d="M100 8 190 62v112l-90 54-90-54V62Z"/>
      <path d="M45 139h110"/>
      <circle cx="153" cy="139" r="4" fill="#f18a5b"/>
    </g>
    <text x="1405" y="1825" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">6</text>
    <text x="1458" y="1827" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">pm</text>
    <text x="1405" y="1870" fill="#f18a5b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">studio</text>
  </g>
