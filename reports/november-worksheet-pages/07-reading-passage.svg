      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Marie Curie is born</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 7?</text><text data-content="body" x="155" y="864" font-size="34">What small clue might help you understand a big story? On November 7,</text>
<text data-content="body" x="155" y="906" font-size="34">Marie Curie was born in Warsaw and became a pioneering scientist who</text>
<text data-content="body" x="155" y="948" font-size="34">studied radioactivity. The source places this story in 1867. That sentence</text>
<text data-content="body" x="155" y="990" font-size="34">gives us the main idea. Now slow down and ask three questions: Who</text>
<text data-content="body" x="155" y="1032" font-size="34">was involved? What changed? Why do people still remember it? The</text>
<text data-content="body" x="155" y="1074" font-size="34">answers make marie curie is born more than a date to memorize. It</text>
<text data-content="body" x="155" y="1116" font-size="34">becomes a story about an invention or everyday idea. The numbers in the</text>
<text data-content="body" x="155" y="1158" font-size="34">activities are there to help you think about the event, not to replace it.</text>
<text data-content="body" x="155" y="1200" font-size="34">Circle the facts you can find in the passage, and underline any number</text>
<text data-content="body" x="155" y="1242" font-size="34">that belongs to a practice situation. When you solve a problem, write an</text>
<text data-content="body" x="155" y="1284" font-size="34">equation and check whether your answer makes sense. The Nobel Prize</text>
<text data-content="body" x="155" y="1326" font-size="34">source supports the historical starting point for this page. After reading,</text>
<text data-content="body" x="155" y="1368" font-size="34">tell a partner one fact and one question. Curiosity is useful: it helps us</text>
<text data-content="body" x="155" y="1410" font-size="34">notice missing details and look for better evidence.</text>
    </g>
