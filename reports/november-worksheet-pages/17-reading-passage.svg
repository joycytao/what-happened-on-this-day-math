  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">The Suez Canal opens</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 17?</text><text data-content="body" x="155" y="864" font-size="34">What small clue might help you understand a big story? On November</text>
<text data-content="body" x="155" y="906" font-size="34">17, The Suez Canal opened and created a shorter water route between</text>
<text data-content="body" x="155" y="948" font-size="34">the Mediterranean Sea and the Red Sea. The source places this story in</text>
<text data-content="body" x="155" y="990" font-size="34">1869. That sentence gives us the main idea. Now slow down and ask</text>
<text data-content="body" x="155" y="1032" font-size="34">three questions: Who was involved? What changed? Why do people still</text>
<text data-content="body" x="155" y="1074" font-size="34">remember it? The answers make the suez canal opens more than a date</text>
<text data-content="body" x="155" y="1116" font-size="34">to memorize. It becomes a story about an invention or everyday idea. The</text>
<text data-content="body" x="155" y="1158" font-size="34">numbers in the activities are there to help you think about the event, not</text>
<text data-content="body" x="155" y="1200" font-size="34">to replace it. Circle the facts you can find in the passage, and underline</text>
<text data-content="body" x="155" y="1242" font-size="34">any number that belongs to a practice situation. When you solve a</text>
<text data-content="body" x="155" y="1284" font-size="34">problem, write an equation and check whether your answer makes sense.</text>
<text data-content="body" x="155" y="1326" font-size="34">The Suez Canal Authority source supports the historical starting point for</text>
<text data-content="body" x="155" y="1368" font-size="34">this page. After reading, tell a partner one fact and one question.</text>
<text data-content="body" x="155" y="1410" font-size="34">Curiosity is useful: it helps us notice missing details and look for better</text>
<text data-content="body" x="155" y="1452" font-size="34">evidence.</text>
    </g>
  </g>
