    <text x="155" y="205" font-size="50" font-weight="700">Name:</text>
    <line x1="350" y1="210" x2="815" y2="210" stroke="#111" stroke-width="5"/>
    <text x="985" y="205" font-size="50" font-weight="700">Date:</text>
    <line x1="1155" y1="210" x2="1390" y2="210" stroke="#111" stroke-width="5"/>
  </g>
  <g stroke="#111" fill="none" stroke-width="4">
    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">NOV</text>
    <text x="772" y="482" font-size="66" font-weight="700">13</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">World Kindness Day</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 13?</text><text data-content="body" x="155" y="864" font-size="34">If you opened a history notebook to November 13, what would you write</text>
<text data-content="body" x="155" y="906" font-size="34">first? You could begin with this fact: World Kindness Day encourages</text>
<text data-content="body" x="155" y="948" font-size="34">people to help others and perform thoughtful acts. World Kindness Day is</text>
<text data-content="body" x="155" y="990" font-size="34">observed on November 13. A notebook entry should do more than copy a</text>
<text data-content="body" x="155" y="1032" font-size="34">title. It should show what happened and why the event matters. In world</text>
<text data-content="body" x="155" y="1074" font-size="34">kindness day, people had to notice, decide, build, travel, discover, or care</text>
<text data-content="body" x="155" y="1116" font-size="34">for something. That is the human part of this a challenge people faced</text>
<text data-content="body" x="155" y="1158" font-size="34">story. The questions that follow use friendly numbers so you can practice</text>
<text data-content="body" x="155" y="1200" font-size="34">math while keeping the event in view. First, retell the main idea. Next, find</text>
<text data-content="body" x="155" y="1242" font-size="34">the quantities named in a question. Finally, choose an operation and</text>
<text data-content="body" x="155" y="1284" font-size="34">show each step. The World Kindness Movement source gives</text>
<text data-content="body" x="155" y="1326" font-size="34">researchers a place to begin checking the claim. You do not need to</text>
<text data-content="body" x="155" y="1368" font-size="34">know every answer before you start. Careful reading, clear work, and a</text>
<text data-content="body" x="155" y="1410" font-size="34">willingness to revise an idea are all part of learning.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
