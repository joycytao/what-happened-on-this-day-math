  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">NOV</text>
    <text x="772" y="482" font-size="66" font-weight="700">3</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Laika travels into space</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 3?</text><text data-content="body" x="155" y="864" font-size="34">If you opened a history notebook to November 3, what would you write</text>
<text data-content="body" x="155" y="906" font-size="34">first? You could begin with this fact: Sputnik 2 carried Laika, a dog, into</text>
<text data-content="body" x="155" y="948" font-size="34">orbit around Earth. The source places this story in 1957. A notebook</text>
<text data-content="body" x="155" y="990" font-size="34">entry should do more than copy a title. It should show what happened</text>
<text data-content="body" x="155" y="1032" font-size="34">and why the event matters. In laika travels into space, people had to</text>
<text data-content="body" x="155" y="1074" font-size="34">notice, decide, build, travel, discover, or care for something. That is the</text>
<text data-content="body" x="155" y="1116" font-size="34">human part of this animals and the living world story. The questions that</text>
<text data-content="body" x="155" y="1158" font-size="34">follow use friendly numbers so you can practice math while keeping the</text>
<text data-content="body" x="155" y="1200" font-size="34">event in view. First, retell the main idea. Next, find the quantities named</text>
<text data-content="body" x="155" y="1242" font-size="34">in a question. Finally, choose an operation and show each step. The</text>
<text data-content="body" x="155" y="1284" font-size="34">HISTORY source gives researchers a place to begin checking the claim.</text>
<text data-content="body" x="155" y="1326" font-size="34">You do not need to know every answer before you start. Careful reading,</text>
<text data-content="body" x="155" y="1368" font-size="34">clear work, and a willingness to revise an idea are all part of learning.</text>
    </g>
  </g>
