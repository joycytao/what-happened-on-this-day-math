  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Toy Story premieres</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 22?</text><text data-content="body" x="155" y="864" font-size="34">What small clue might help you understand a big story? On November</text>
<text data-content="body" x="155" y="906" font-size="34">22, Toy Story premiered as the first feature-length computer-animated</text>
<text data-content="body" x="155" y="948" font-size="34">film. The source places this story in 1995. That sentence gives us the</text>
<text data-content="body" x="155" y="990" font-size="34">main idea. Now slow down and ask three questions: Who was involved?</text>
<text data-content="body" x="155" y="1032" font-size="34">What changed? Why do people still remember it? The answers make toy</text>
<text data-content="body" x="155" y="1074" font-size="34">story premieres more than a date to memorize. It becomes a story about</text>
<text data-content="body" x="155" y="1116" font-size="34">an invention or everyday idea. The numbers in the activities are there to</text>
<text data-content="body" x="155" y="1158" font-size="34">help you think about the event, not to replace it. Circle the facts you can</text>
<text data-content="body" x="155" y="1200" font-size="34">find in the passage, and underline any number that belongs to a practice</text>
<text data-content="body" x="155" y="1242" font-size="34">situation. When you solve a problem, write an equation and check</text>
<text data-content="body" x="155" y="1284" font-size="34">whether your answer makes sense. The Disney source supports the</text>
<text data-content="body" x="155" y="1326" font-size="34">historical starting point for this page. After reading, tell a partner one fact</text>
<text data-content="body" x="155" y="1368" font-size="34">and one question. Curiosity is useful: it helps us notice missing details</text>
<text data-content="body" x="155" y="1410" font-size="34">and look for better evidence.</text>
    </g>
  </g>
