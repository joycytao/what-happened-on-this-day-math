    <rect x="690" y="305" width="165" height="82"/>
    <rect x="690" y="387" width="165" height="145"/>
  </g>
  <g fill="#111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="772" y="365" font-size="47" font-weight="700">NOV</text>
    <text x="772" y="482" font-size="66" font-weight="700">26</text>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Alice&apos;s Adventures in Wonderland</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 26?</text><text data-content="body" x="155" y="864" font-size="34">Have you ever wondered how one idea can change an ordinary day? On</text>
<text data-content="body" x="155" y="906" font-size="34">November 26, Lewis Carroll&apos;s story follows Alice as she meets unusual</text>
<text data-content="body" x="155" y="948" font-size="34">characters and explores a surprising world. The source places this story</text>
<text data-content="body" x="155" y="990" font-size="34">in 1865. Picture the people who first noticed this possibility. They needed</text>
<text data-content="body" x="155" y="1032" font-size="34">patience: a useful idea often begins with an observation, a question, or a</text>
<text data-content="body" x="155" y="1074" font-size="34">problem that will not go away. This story is about a challenge people</text>
<text data-content="body" x="155" y="1116" font-size="34">faced, but it is also about paying attention. The title, Alice&apos;s Adventures in</text>
<text data-content="body" x="155" y="1158" font-size="34">Wonderland, is a signpost for our reading, not the whole story. Look for</text>
<text data-content="body" x="155" y="1200" font-size="34">the people, place, and action hidden behind it. The math questions use</text>
<text data-content="body" x="155" y="1242" font-size="34">simple classroom situations connected to the topic. Some numbers are</text>
<text data-content="body" x="155" y="1284" font-size="34">historical; others are clearly marked examples for practice. Read the</text>
<text data-content="body" x="155" y="1326" font-size="34">passage once to find the main event. Read it again to find details that</text>
<text data-content="body" x="155" y="1368" font-size="34">help you decide which operation to use. Then explain the event in your</text>
<text data-content="body" x="155" y="1410" font-size="34">own words. The WorldCat source is the research starting point. A good</text>
<text data-content="body" x="155" y="1452" font-size="34">historian does not guess when a source can be checked, and a good</text>
<text data-content="body" x="155" y="1494" font-size="34">mathematician does not skip the work.</text>
    </g>
  </g>
  <g transform="translate(1495 1876) scale(0.5) translate(-1495 -1876)">
