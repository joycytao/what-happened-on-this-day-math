  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <g data-content="article" data-x="155" data-width="1235" data-max-characters="72">
      <text data-content="article" x="155" y="670" font-size="34" font-weight="700">Tutankhamun&apos;s tomb is found</text><text data-content="article" x="155" y="744" font-size="34" font-weight="600">What detail would you check first on November 4?</text><text data-content="body" x="155" y="864" font-size="34">What would you ask before accepting a new fact? On November 4,</text>
<text data-content="body" x="155" y="906" font-size="34">Archaeologist Howard Carter discovered the entrance to Tutankhamun&apos;s</text>
<text data-content="body" x="155" y="948" font-size="34">tomb. The source places this story in 1922. The answer begins with</text>
<text data-content="body" x="155" y="990" font-size="34">evidence. Someone recorded, observed, built, taught, or remembered</text>
<text data-content="body" x="155" y="1032" font-size="34">something, and later readers can compare the claim with a reliable</text>
<text data-content="body" x="155" y="1074" font-size="34">source. Tutankhamun&apos;s tomb is found gives us a window into a challenge</text>
<text data-content="body" x="155" y="1116" font-size="34">people faced. Notice the action in the sentence, then imagine what a</text>
<text data-content="body" x="155" y="1158" font-size="34">person might have seen or heard at the time. The practice problems are</text>
<text data-content="body" x="155" y="1200" font-size="34">short on purpose. They ask you to count, compare, multiply, divide, or</text>
<text data-content="body" x="155" y="1242" font-size="34">use a measurement while thinking about the topic. Keep the story and the</text>
<text data-content="body" x="155" y="1284" font-size="34">calculation connected, but do not invent a fact that the passage does not</text>
<text data-content="body" x="155" y="1326" font-size="34">say. The HISTORY source is named so the claim can be checked. When</text>
<text data-content="body" x="155" y="1368" font-size="34">you finish, share the detail that surprised you most and explain how your</text>
<text data-content="body" x="155" y="1410" font-size="34">equation answers the question.</text>
    </g>
  </g>
