name: PM triage proactive queue audit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const audit = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/pm-triage-audit.mjs`).href);
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100, sort: 'created', direction: 'asc' });
            const allPullRequests = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', per_page: 100, sort: 'created', direction: 'asc' });
            const linkPattern = (number) => new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+(?:(?:[^\\s/]+)\\/[^\\s#]+)?#${number}\\b`, 'i');
            const issues = all.filter((item) => !item.pull_request).map((item) => ({
              ...item,
              pullRequests: allPullRequests.filter((pr) => linkPattern(item.number).test(pr.body || '') || (item.body || '').includes(`pull/${pr.number}`)),
            }));
            for (const item of issues.filter((candidate) => candidate.labels.some((label) => label.name === 'state: claimed'))) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number, per_page: 100 });
              const claim = [...comments].reverse().map((comment) => comment.body || '').find((body) => /Claimed at:\s*`[^`]+`/i.test(body));
              if (!claim) continue;
              item.claim = {
                role: claim.match(/- From:\s*`([^`]+)`/i)?.[1] || null,
                claimedAt: claim.match(/Claimed at:\s*`([^`]+)`/i)?.[1] || null,
                handoffId: claim.match(/Handoff ID:\s*`([^`]+)`/i)?.[1] || null,
              };
            }
            const openIssues = issues.filter((item) => item.state === 'open');
            const openPullRequests = allPullRequests.filter((pr) => pr.state === 'open');
            const result = audit.auditQueue(issues, openPullRequests);
            const repairs = result.repairable.map((entry) => ({
              number: entry.number,
              labels: entry.repair.labels || null,
              add: [...new Set([...(entry.repair.add || []), ...(entry.health?.repair?.add || [])])],
              remove: [...new Set([...(entry.repair.remove || []), ...(entry.health?.repair?.remove || [])])],
              category: entry.category,
              reason: entry.repair.reason || entry.health?.action || "routine metadata reconciliation",
            }));
            const fingerprint = JSON.stringify({ categories: result.byCategory, eligible: result.eligible.map((entry) => entry.number), repairs });

            for (const entry of repairs) {
              const item = issues.find((candidate) => Number(candidate.number) === Number(entry.number));
              if (!item) continue;
              const current = item.labels.map((label) => label.name);
              const next = entry.labels
                ? [...entry.labels]
                : current.filter((label) => !entry.remove.includes(label));
              for (const label of entry.add) if (!next.includes(label)) next.push(label);
              await github.rest.issues.update({ owner, repo, issue_number: item.number, labels: next });
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number, per_page: 100 });
              const marker = `<!-- CODEX_TRIAGE_REPAIR:${item.number}:${Buffer.from(JSON.stringify(entry)).toString('base64url')} -->`;
              if (!comments.some((comment) => (comment.body || '').includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: item.number, body: `${marker}\nCODEX_TRIAGE_REPAIR:v1\n\n- Before: ${current.join(', ') || 'none'}\n- After: ${next.join(', ') || 'none'}\n- Category: ${entry.category}\n- Reason: ${entry.reason}\n- Authority boundary: no product, architecture, domain, implementation, quality, or release decision was changed.` });
              }
            }

            const anchor = openIssues[0] || issues[0];
            if (anchor) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: anchor.number, per_page: 100 });
              const marker = `<!-- CODEX_TRIAGE_AUDIT:${Buffer.from(fingerprint).toString('base64url')} -->`;
              if (!comments.some((comment) => (comment.body || '').includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: anchor.number, body: `${marker}\n${audit.renderAuditComment(result)}` });
              }
            }
            core.notice(`PM triage queue audit: ${result.entries.length} open Issues, ${result.eligible.length} eligible pickup, ${result.repairable.length} routine repairs, noPickup=${result.noPickup}`);
