name: PM triage proactive queue audit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const audit = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/pm-triage-audit.mjs`).href);
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100, sort: 'created', direction: 'asc' });
            const openIssues = all.filter((item) => item.state === 'open' && !item.pull_request);
            const openPullRequests = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const result = audit.auditQueue(openIssues, openPullRequests);
            const fingerprint = JSON.stringify({ categories: result.byCategory, eligible: result.eligible.map((entry) => entry.number), repairs: result.repairable.map((entry) => [entry.number, entry.repair.add, entry.repair.remove]) });

            for (const entry of result.repairable) {
              const item = openIssues.find((candidate) => Number(candidate.number) === Number(entry.number));
              if (!item) continue;
              const current = item.labels.map((label) => label.name);
              const next = current.filter((label) => !entry.repair.remove.includes(label));
              for (const label of entry.repair.add) if (!next.includes(label)) next.push(label);
              await github.rest.issues.update({ owner, repo, issue_number: item.number, labels: next });
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number, per_page: 100 });
              const marker = `<!-- CODEX_TRIAGE_REPAIR:${item.number}:${Buffer.from(JSON.stringify(entry.repair)).toString('base64url')} -->`;
              if (!comments.some((comment) => (comment.body || '').includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: item.number, body: `${marker}\nCODEX_TRIAGE_REPAIR:v1\n\n- Before: ${current.join(', ') || 'none'}\n- After: ${next.join(', ') || 'none'}\n- Reason: normalize unambiguous status-label aliases only.\n- Evidence: ${entry.reasons.join('; ') || 'routine metadata normalization'}\n- Authority boundary: no product, architecture, domain, implementation, quality, or release decision was changed.` });
              }
            }

            const anchor = openIssues[0];
            if (anchor) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: anchor.number, per_page: 100 });
              const marker = `<!-- CODEX_TRIAGE_AUDIT:${Buffer.from(fingerprint).toString('base64url')} -->`;
              if (!comments.some((comment) => (comment.body || '').includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: anchor.number, body: `${marker}\n${audit.renderAuditComment(result)}` });
              }
            }
            core.notice(`PM triage queue audit: ${result.entries.length} open Issues, ${result.eligible.length} eligible pickup, ${result.repairable.length} routine repairs, noPickup=${result.noPickup}`);
