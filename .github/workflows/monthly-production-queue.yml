name: Queue monthly math production

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Monthly context Issue number for a deterministic/manual run
        required: true
        type: number

permissions:
  contents: read
  issues: write
  repository-projects: write

concurrency:
  group: monthly-production-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'status: ready to pickup' && contains(github.event.issue.body, 'monthly-context:'))
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: ${{ vars.MATH_PROJECT_OWNER || 'joycytao' }}
      PROJECT_NUMBER: ${{ vars.MATH_PROJECT_NUMBER || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source Issue and validate, create/update production Issues
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: ${{ env.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100 });
            fs.writeFileSync('/tmp/monthly-context-issue.json', JSON.stringify(issue));
            fs.writeFileSync('/tmp/monthly-context-comments.json', JSON.stringify(comments));
            execFileSync('node', ['scripts/build-monthly-production-plan.mjs', '--issue', '/tmp/monthly-context-issue.json', '--comments', '/tmp/monthly-context-comments.json', '--run-url', process.env.RUN_URL, '--project-owner', process.env.PROJECT_OWNER, '--project-number', process.env.PROJECT_NUMBER, '--output', '/tmp/monthly-production-plan.json'], { stdio: 'inherit' });
            const result = JSON.parse(fs.readFileSync('/tmp/monthly-production-plan.json', 'utf8'));
            if (!result.actionable) return core.info('Not a monthly context Issue; no-op.');
            if (!result.valid) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `<!-- monthly-production-validation -->\nMonthly production was not queued because the context input is invalid:\n\n${result.errors.map((error) => `- ${error}`).join('\n')}` });
              return core.setFailed('Monthly context input is invalid; no production Issues were created.');
            }
            const labels = [
              ['type: feature', 'a2eeef', 'A request for new or improved functionality'],
              ['content:monthly', '1d76db', 'Monthly content source'],
              ['status: ready to pickup', '0e8a16', 'Approved for Codex pickup'],
              ['status: blocked', 'e4e669', 'Blocked by a dependency'],
              ['status: pending review', 'fbca04', 'Waiting for human review'],
            ];
            for (const [name, color, description] of labels) {
              try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }
            const all = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100 });
            const desiredIssues = [result.plan.parent, ...result.plan.issues];
            const issueIds = [];
            for (const desired of desiredIssues) {
              const existing = all.find((candidate) => !candidate.pull_request && (candidate.body || '').includes(desired.marker));
              const payload = { owner: context.repo.owner, repo: context.repo.repo, title: desired.title, body: desired.body, labels: desired.labels, state: 'open' };
              const saved = existing ? await github.rest.issues.update({ ...payload, issue_number: existing.number }) : await github.rest.issues.create(payload);
              issueIds.push(saved.data.node_id);
              core.info(`${existing ? 'Updated' : 'Created'} #${saved.data.number}: ${desired.title}`);
            }
            const projectData = await github.graphql(`query($login:String!,$number:Int!){ user(login:$login){ projectV2(number:$number){ id title items(first:100){nodes{content{... on Issue{id}}}} } } }`, { login: process.env.PROJECT_OWNER, number: Number(process.env.PROJECT_NUMBER) });
            const project = projectData.user?.projectV2;
            if (!project) throw new Error(`Project ${process.env.PROJECT_OWNER}/${process.env.PROJECT_NUMBER} was not found`);
            const existingContent = new Set(project.items.nodes.map((item) => item.content?.id).filter(Boolean));
            for (const contentId of issueIds) {
              if (existingContent.has(contentId)) continue;
              await github.graphql(`mutation($projectId:ID!,$contentId:ID!){ addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){ item { id } } }`, { projectId: project.id, contentId });
            }
            core.info(`Queued ${issueIds.length} Issues in Project ${project.title}; status fields remain human-managed.`);
