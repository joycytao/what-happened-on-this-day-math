name: Route implementation PRs

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-state-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.event.review.pull_request_url || github.run_id }}
  cancel-in-progress: false

# Consultation labels emitted by this workflow: agent: architect and
# agent: social-expert. The primary implementation label is agent: quality-engineer.

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance validators
        uses: actions/checkout@v4
      - name: Create the next PR handoff
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.review?.pull_request_url?.split('/').pop();
            if (!number) return;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: Number(number) });
            const prComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(number) });
            const linkedIssueNumbers = [...(pr.data.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:(?:[^\s/]+)\/[^\s#]+)?#(\d+)/gi)].map(match => Number(match[1]));
            const linkedIssueNumber = linkedIssueNumbers[0];
            const workItemNumber = linkedIssueNumber || Number(number);
            const linkedIssue = await github.rest.issues.get({ owner, repo, issue_number: workItemNumber });
            const issueComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: workItemNumber });
            const { pathToFileURL } = require('node:url');
            const { validateReadyForHumanGate } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/human-gate-integrity.mjs`).href);
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            const reviewGate = linkedIssue.data.body?.match(/^Review gate:\s*([a-z-]+)\s*$/im)?.[1]?.toLowerCase() || 'routine';
            const humanDecisionRequired = new Set(['ui-design', 'final-copy', 'final-product', 'credentials', 'public-dispatch']).has(reviewGate);
            const comments = [...prComments, ...issueComments];
            const sha = pr.data.head.sha.slice(0, 12);
            const already = (id) => comments.some(comment => comment.body?.includes(`Handoff ID: \`${id}\``));
            const outputKinds = { 'pm-triage': 'triage-decision', 'product-manager': 'product-decision', architect: 'architecture-decision', 'social-expert': 'social-decision', developer: 'implementation', 'quality-engineer': 'qa-result' };
            const body = (handoffId, from, to, status, nextAction, evidence) => [
              '<!-- CODEX_HANDOFF:v1 -->', '', '## Handoff', '',
              `- Handoff ID: \`${handoffId}\``, `- From: \`${from}\``, `- To: \`${to}\``,
              `- Work item: \`${owner}/${repo}#${workItemNumber}\``, `- Status: \`${status}\``,
                  `- Reason: ${nextAction}`, `- Preconditions: PR event and linked Issue are available`, `- Review gate: ${reviewGate}`, `- Human decision: ${to === 'ready-for-human' && humanDecisionRequired ? 'yes' : 'no; operational merge only'}`,
              '- Completed:', ...(status === 'blocked' || status === 'rejected' ? [] : ['  - PR event recorded']), '- Required next action:', `  - ${nextAction}`,
              '- Evidence:', `  - ${evidence}`, '- Constraints:', '  - do not merge automatically',
              '- Blockers:', ...(status === 'blocked' || status === 'rejected' ? [`  - ${nextAction}`] : ['  - none']), '- Expected output:', '  - reviewed handoff evidence',
              `- Output kind: ${outputKinds[from]}`, `- Return path: ${from === 'quality-engineer' && to === 'ready-for-human' ? 'developer' : 'pm-triage'}`,
              '- Prerequisites satisfied:', '  - PR event and linked Issue are available', '- Prerequisites missing:',
            ].join('\n');
            const mergeableState = pr.data.mergeable_state || 'unknown';
            const isConflict = mergeableState === 'dirty' || (pr.data.mergeable === false && !['blocked', 'unknown'].includes(mergeableState));
            const isConflictResolved = pr.data.mergeable === true && !['dirty', 'unknown'].includes(mergeableState);
            const conflictAlertId = `issue:${workItemNumber}:pr:${number}:conflict:${sha}:${mergeableState}`;
            const conflictResolutionId = `issue:${workItemNumber}:pr:${number}:conflict-resolved:${sha}`;
            const stateTransition = async (nextLabels, commentBody, fingerprint) => {
              const fresh = await github.rest.issues.get({ owner, repo, issue_number: workItemNumber });
              return transitionIssueState({ github, owner, repo, issueNumber: workItemNumber, expectedLabels: fresh.data.labels.map(label => label.name), nextLabels, body: fresh.data.body || '', commentBody, commentFingerprint: fingerprint });
            };
            const conflictBody = (id, resolved = false) => [
              '<!-- CODEX_CONFLICT_ALERT:v1 -->', '',
              resolved ? '## PR conflict resolved' : '## PR conflict detected', '',
              `- Alert ID: \`${id}\``,
              `- Work item: \`${owner}/${repo}#${workItemNumber}\``,
              `- Pull request: https://github.com/${owner}/${repo}/pull/${number}`,
              `- Mergeable: \`${String(pr.data.mergeable)}\``,
              `- Mergeable state: \`${mergeableState}\``,
              `- Base: \`${pr.data.base.ref}\``,
              `- Head: \`${pr.data.head.ref}\` @ \`${pr.data.head.sha}\``,
              resolved
                ? '- Evidence: GitHub reports the PR mergeable again; developer must still rerun focused verification before handoff.'
                : '- Required action: developer fetches the latest base, resolves only in-scope conflicts in an isolated worktree, and reruns checks.',
              resolved
                ? '- Return path: developer → quality-engineer after the focused checks pass.'
                : '- Return path: pm-triage for ambiguous, out-of-scope, or permission-blocked conflicts.',
            ].join('\n');
            if (isConflict && !comments.some(comment => comment.body?.includes(`Alert ID: \`${conflictAlertId}\``))) {
              const current = linkedIssue.data.labels.map(label => label.name);
              const preserved = current.filter(label => !label.startsWith('agent: ') && !label.startsWith('state: ') && !label.startsWith('status:') && label !== 'ready-for-human');
              await stateTransition([...preserved, 'agent: developer', 'state: changes-requested'], conflictBody(conflictAlertId), `Alert ID: \`${conflictAlertId}\``);
              const handoffId = `issue:${workItemNumber}:pr:${number}:quality-engineer:developer:conflict:${sha}`;
              if (!already(handoffId)) {
                await stateTransition([...preserved, 'agent: developer', 'state: changes-requested'], body(handoffId, 'quality-engineer', 'developer', 'rejected', `resolve PR #${number} merge conflicts before QA`, `PR #${number} reports mergeable_state=${mergeableState}; ${pr.data.base.ref} ← ${pr.data.head.ref} @ ${pr.data.head.sha}`), `Handoff ID: \`${handoffId}\``);
              }
              return;
            }
            if (isConflictResolved && comments.some(comment => comment.body?.includes('<!-- CODEX_CONFLICT_ALERT:v1 -->')) && !comments.some(comment => comment.body?.includes(`Alert ID: \`${conflictResolutionId}\``))) {
              const current = linkedIssue.data.labels.map(label => label.name);
              await stateTransition(current, conflictBody(conflictResolutionId, true), `Alert ID: \`${conflictResolutionId}\``);
            }
            const hasDeveloperHandoff = comments.some(comment =>
              comment.body?.includes('<!-- CODEX_HANDOFF:v1 -->') &&
              comment.body?.includes('From: `developer`') &&
              comment.body?.includes('To: `quality-engineer`'));
            if (context.eventName === 'pull_request') {
              if (!hasDeveloperHandoff) return;
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: Number(number), per_page: 100 });
              const paths = files.map(file => file.filename);
              const hasArchitectPath = paths.some(path => path.startsWith('.github/') || path.startsWith('src/') || path.startsWith('docs/') || path === 'AGENTS.md');
              const hasSocialPath = paths.some(path => /social|carousel|reel|template/i.test(path));
              const qaId = `issue:${workItemNumber}:pr:${number}:developer:quality-engineer:${sha}`;
              if (!already(qaId)) {
                const current = linkedIssue.data.labels.map(label => label.name);
                const preserved = current.filter(label => !label.startsWith('agent: ') && !label.startsWith('state: ') && !label.startsWith('status:') && label !== 'ready-for-human');
                await stateTransition([...preserved, 'agent: quality-engineer', 'status: qa'], body(qaId, 'developer', 'quality-engineer', 'completed', `review PR #${number} against the Issue acceptance criteria`, `PR ${sha}: https://github.com/${owner}/${repo}/pull/${number}`), `Handoff ID: \`${qaId}\``);
              }
              if (hasArchitectPath) {
                const id = `issue:${workItemNumber}:pr:${number}:architect:consult:${sha}`;
                if (!already(id)) await stateTransition(linkedIssue.data.labels.map(label => label.name), body(id, 'pm-triage', 'architect', 'requested', 'review governance, schema, or orchestration impact', paths.filter(path => path.startsWith('.github/') || path.startsWith('src/') || path.startsWith('docs/') || path === 'AGENTS.md').join(', ')), `Handoff ID: \`${id}\``);
              }
              if (hasSocialPath) {
                const id = `issue:${workItemNumber}:pr:${number}:social-expert:consult:${sha}`;
                if (!already(id)) await stateTransition(linkedIssue.data.labels.map(label => label.name), body(id, 'pm-triage', 'social-expert', 'requested', 'review social format and template impact', paths.filter(path => /social|carousel|reel|template/i.test(path)).join(', ')), `Handoff ID: \`${id}\``);
              }
              return;
            }

            const review = context.payload.review;
            const failed = review.state === 'changes_requested' || /fail|reject|block/i.test(review.body || '');
            if (!failed) {
              const gateValidation = validateReadyForHumanGate({
                labels: [...linkedIssue.data.labels.map(label => label.name), 'ready-for-human'],
                body: linkedIssue.data.body || '',
                comments: issueComments,
              });
              if (!gateValidation.valid) {
                core.setFailed(`ready-for-human validator rejected transition: ${gateValidation.errors.join('; ')}`);
                return;
              }
            }
            const id = failed ? `issue:${workItemNumber}:pr:${number}:quality-engineer:developer:${sha}` : `issue:${workItemNumber}:pr:${number}:quality-engineer:ready-for-human:${sha}`;
            if (already(id)) return;
            const next = failed ? 'developer' : 'ready-for-human';
            const state = failed ? 'changes-requested' : 'ready-for-human';
            const current = linkedIssue.data.labels.map(label => label.name);
            const preserved = current.filter(label => !label.startsWith('agent: ') && !label.startsWith('state: ') && !label.startsWith('status:') && label !== 'ready-for-human');
            await stateTransition(failed ? [...preserved, 'agent: developer', 'state: changes-requested'] : [...preserved, 'ready-for-human'], body(id, 'quality-engineer', next, failed ? 'rejected' : 'completed', failed ? `address QA evidence and update PR #${number}` : `human maintainer reviews PR #${number} and decides whether to merge`, review.html_url || `review on PR #${number}`), `Handoff ID: \`${id}\``);
