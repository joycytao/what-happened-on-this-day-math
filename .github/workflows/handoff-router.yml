name: Route agent handoffs

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      (github.event_name == 'issue_comment' && github.event.comment.body != '') ||
      (github.event_name == 'pull_request_review' && github.event.review.body != '')
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance validators
        uses: actions/checkout@v4
      - name: Validate and route the handoff marker
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.eventName === 'issue_comment'
              ? context.payload.comment.body
              : context.payload.review.body;
            if (!body.includes('<!-- CODEX_HANDOFF:v1 -->')) return;
            const field = (label) => body.match(new RegExp("^- " + label + ": ?([^\\n]+)", 'm'))?.[1]?.replaceAll('`', '').trim();
            const list = (label) => {
              const match = body.match(new RegExp(`^- ${label}:\\n([\\s\\S]*?)(?=^- \\w|$)`, 'm'));
              return match ? [...match[1].matchAll(/^\\s{2}- (.+)$/gm)].map(item => item[1].trim()) : [];
            };
            const handoff = {
              handoffId: field('Handoff ID'), from: field('From'), to: field('To'),
              workItem: field('Work item'), status: field('Status'),
              completed: list('Completed'), requiredNextAction: list('Required next action'),
              evidence: list('Evidence'), constraints: list('Constraints'),
              blockers: list('Blockers'), expectedOutput: list('Expected output'),
              outputKind: field('Output kind'), returnPath: field('Return path'),
              prerequisitesSatisfied: list('Prerequisites satisfied'), prerequisitesMissing: list('Prerequisites missing'),
            };
            if (!handoff.handoffId) {
              core.setFailed('Invalid CODEX_HANDOFF:v1 markdown: missing Handoff ID');
              return;
            }

            const { owner, repo } = context.repo;
            const eventNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const linkedIssueNumbers = context.payload.pull_request
              ? [...(context.payload.pull_request.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd]?|ing)?|resolve[sd]?)\s+(?:(?:[^\s/]+)\/[^\s#]+)?#(\d+)/gi)].map(match => Number(match[1]))
              : [];
            const issueNumber = linkedIssueNumbers[0] || eventNumber;
            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const { pathToFileURL } = require('node:url');
            const { validateReadyForHumanGate } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/human-gate-integrity.mjs`).href);
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            const duplicate = comments.some(comment =>
              comment.body?.includes(`"handoffId":"${handoff.handoffId}"`) ||
              comment.body?.includes(`Handoff ID: \`${handoff.handoffId}\``) ||
              comment.body?.includes(`handoffId: ${handoff.handoffId}`));
            if (duplicate) return;

            const roles = new Set(['pm-triage', 'product-manager', 'architect', 'social-expert', 'developer', 'quality-engineer', 'ready-for-human']);
            const outputKinds = new Map([['pm-triage', 'triage-decision'], ['product-manager', 'product-decision'], ['architect', 'architecture-decision'], ['social-expert', 'social-decision'], ['developer', 'implementation'], ['quality-engineer', 'qa-result']]);
            const returnPaths = new Map([['pm-triage', new Set(['pm-triage'])], ['product-manager', new Set(['pm-triage'])], ['architect', new Set(['pm-triage'])], ['social-expert', new Set(['pm-triage'])], ['developer', new Set(['pm-triage'])], ['quality-engineer', new Set(['developer', 'pm-triage'])]]);
            const legalTargets = new Map([['pm-triage', new Set(['pm-triage', 'product-manager', 'architect', 'social-expert', 'developer'])], ['product-manager', new Set(['pm-triage'])], ['architect', new Set(['pm-triage'])], ['social-expert', new Set(['pm-triage'])], ['developer', new Set(['quality-engineer', 'pm-triage'])], ['quality-engineer', new Set(['ready-for-human', 'developer', 'pm-triage'])]]);
            const decisionRoles = new Set(['architect', 'product-manager', 'social-expert']);
            const errors = [];
            for (const field of ['handoffId', 'from', 'to', 'workItem', 'status']) {
              if (typeof handoff[field] !== 'string' || handoff[field].length === 0) errors.push(`${field}_invalid`);
            }
            if (!roles.has(handoff.from) || !roles.has(handoff.to)) errors.push('role_invalid');
            if (handoff.outputKind !== outputKinds.get(handoff.from)) errors.push('role_output_kind_invalid');
            if (!returnPaths.get(handoff.from)?.has(handoff.returnPath)) errors.push('role_output_return_path_invalid');
            if (!legalTargets.get(handoff.from)?.has(handoff.to)) errors.push('role_output_target_not_legal_for_role');
            const completedEvidence = handoff.completed.filter(value => value.toLowerCase() !== 'none');
            const blockerEvidence = handoff.blockers.filter(value => value.toLowerCase() !== 'none');
            if (completedEvidence.length && blockerEvidence.length) errors.push('completed_and_blocked_conflict');
            if (['completed', 'accepted'].includes(handoff.status) && !completedEvidence.length) errors.push('successful_output_requires_completed_evidence');
            if (['blocked', 'rejected'].includes(handoff.status) && !blockerEvidence.length) errors.push('blocked_output_requires_blocker_evidence');
            if (handoff.prerequisitesMissing.length && handoff.status !== 'blocked') errors.push('unsatisfied_prerequisite_cannot_be_crossed');
            if (handoff.prerequisitesMissing.length && (handoff.to !== 'pm-triage' || handoff.returnPath !== 'pm-triage')) errors.push('unsatisfied_prerequisite_must_return_to_pm_triage');
            if (handoff.status === 'blocked' && handoff.to !== 'pm-triage') errors.push('blocked_output_must_target_pm_triage');
            if (handoff.status === 'rejected' && !(handoff.from === 'quality-engineer' && handoff.to === 'developer')) errors.push('rejected_output_must_return_to_developer_from_quality_engineer');
            if (handoff.status === 'blocked') {
              handoff.nextRole = 'pm-triage';
              handoff.nextState = 'status: blocked';
            } else if (decisionRoles.has(handoff.from) && handoff.status === 'completed' && handoff.to === 'pm-triage') {
              handoff.nextRole = 'pm-triage';
              handoff.nextState = 'status: pending review';
            } else if (handoff.from === 'pm-triage' && handoff.to === 'developer' && ['accepted', 'completed'].includes(handoff.status)) {
              if (!issue.data.labels.some(label => label.name === 'status: ready to pickup')) errors.push('developer_gate_missing');
              handoff.nextRole = 'developer';
              handoff.nextState = 'implementation';
            } else if (handoff.from === 'developer' && handoff.to === 'quality-engineer' && handoff.status === 'completed') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              handoff.nextRole = 'quality-engineer';
              handoff.nextState = 'status: qa';
            } else if (handoff.from === 'quality-engineer' && handoff.to === 'developer' && handoff.status === 'rejected') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              handoff.nextRole = 'developer';
              handoff.nextState = 'changes-requested';
            } else if (handoff.from === 'quality-engineer' && handoff.status === 'completed') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              const gateValidation = validateReadyForHumanGate({
                labels: [...issue.data.labels.map(label => label.name), 'ready-for-human'],
                body: issue.data.body || '',
                comments,
              });
              if (!gateValidation.valid) errors.push(...gateValidation.errors);
              handoff.nextState = 'ready-for-human';
            } else {
              errors.push('unsupported_transition');
            }
            if (errors.length) {
              core.setFailed(`Handoff ${handoff.handoffId} rejected: ${[...new Set(errors)].join(', ')}`);
              return;
            }

            const current = issue.data.labels.map(label => label.name);
            const derived = (label) => label.startsWith('agent: ') || label.startsWith('state: ') || label.startsWith('status:') || label === 'ready-for-human';
            const labels = current.filter((label) => !derived(label));
            if (handoff.nextRole) labels.push(`agent: ${handoff.nextRole}`);
            if (handoff.nextState === 'ready-for-human') labels.push('ready-for-human');
            else if (handoff.nextState?.startsWith('status: ')) labels.push(handoff.nextState);
            else if (handoff.nextState) labels.push(`state: ${handoff.nextState}`);
            const routedBody = [
                `<!-- CODEX_HANDOFF_ROUTED:v1 -->`,
                `<!-- CODEX_HANDOFF_ROUTE:${handoff.handoffId} -->`,
                `Handoff ${handoff.handoffId} routed successfully.`,
                handoff.nextRole ? `Next role: ${handoff.nextRole}` : 'Next role: human review',
                handoff.nextState ? `State: ${handoff.nextState}` : null,
                'GitHub Actions coordinated this handoff; no model or API token was invoked.'
              ].filter(Boolean).join('\n');
            await transitionIssueState({ github, owner, repo, issueNumber, expectedLabels: current, nextLabels: labels, body: issue.data.body || '', commentBody: routedBody, commentFingerprint: `<!-- CODEX_HANDOFF_ROUTE:${handoff.handoffId} -->` });
