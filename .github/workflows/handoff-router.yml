name: Route agent handoffs

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  route:
    if: >-
      (github.event_name == 'issue_comment' && github.event.comment.body != '') ||
      (github.event_name == 'pull_request_review' && github.event.review.body != '')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and route the handoff marker
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.eventName === 'issue_comment'
              ? context.payload.comment.body
              : context.payload.review.body;
            if (!body.includes('<!-- CODEX_HANDOFF:v1 -->')) return;
            const field = (label) => body.match(new RegExp("^- " + label + ": ?([^\\n]+)", 'm'))?.[1]?.replaceAll('`', '').trim();
            const list = (label) => {
              const match = body.match(new RegExp(`^- ${label}:\\n([\\s\\S]*?)(?=^- \\w|$)`, 'm'));
              return match ? [...match[1].matchAll(/^\\s{2}- (.+)$/gm)].map(item => item[1].trim()) : [];
            };
            const handoff = {
              handoffId: field('Handoff ID'), from: field('From'), to: field('To'),
              workItem: field('Work item'), status: field('Status'),
              completed: list('Completed'), requiredNextAction: list('Required next action'),
              evidence: list('Evidence'), constraints: list('Constraints'),
              blockers: list('Blockers'), expectedOutput: list('Expected output'),
            };
            if (!handoff.handoffId) {
              core.setFailed('Invalid CODEX_HANDOFF:v1 markdown: missing Handoff ID');
              return;
            }

            const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const { owner, repo } = context.repo;
            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const duplicate = comments.some(comment =>
              comment.body?.includes(`"handoffId":"${handoff.handoffId}"`) ||
              comment.body?.includes(`Handoff ID: \`${handoff.handoffId}\``) ||
              comment.body?.includes(`handoffId: ${handoff.handoffId}`));
            if (duplicate) return;

            const roles = new Set(['pm-triage', 'product-manager', 'architect', 'social-expert', 'developer', 'quality-engineer']);
            const decisionRoles = new Set(['architect', 'product-manager', 'social-expert']);
            const errors = [];
            for (const field of ['handoffId', 'from', 'to', 'workItem', 'status']) {
              if (typeof handoff[field] !== 'string' || handoff[field].length === 0) errors.push(`${field}_invalid`);
            }
            if (!roles.has(handoff.from) || !roles.has(handoff.to)) errors.push('role_invalid');
            if (handoff.status === 'blocked') {
              handoff.nextRole = 'pm-triage';
              handoff.nextState = 'blocked';
            } else if (decisionRoles.has(handoff.from) && handoff.status === 'completed' && handoff.to === 'pm-triage') {
              handoff.nextRole = 'pm-triage';
              handoff.nextState = 'decision-complete';
            } else if (handoff.from === 'pm-triage' && handoff.to === 'developer' && ['accepted', 'completed'].includes(handoff.status)) {
              if (!issue.data.labels.some(label => label.name === 'status: ready to pickup')) errors.push('developer_gate_missing');
              handoff.nextRole = 'developer';
              handoff.nextState = 'implementation';
            } else if (handoff.from === 'developer' && handoff.to === 'quality-engineer' && handoff.status === 'completed') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              handoff.nextRole = 'quality-engineer';
              handoff.nextState = 'qa';
            } else if (handoff.from === 'quality-engineer' && handoff.to === 'developer' && handoff.status === 'rejected') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              handoff.nextRole = 'developer';
              handoff.nextState = 'changes-requested';
            } else if (handoff.from === 'quality-engineer' && handoff.status === 'completed') {
              if (!context.payload.pull_request) errors.push('pull_request_required');
              handoff.nextState = 'human-review';
            } else {
              errors.push('unsupported_transition');
            }
            if (errors.length) {
              core.setFailed(`Handoff ${handoff.handoffId} rejected: ${[...new Set(errors)].join(', ')}`);
              return;
            }

            const current = issue.data.labels.map(label => label.name);
            const remove = current.filter(label => label.startsWith('agent: ') || label.startsWith('state: '));
            for (const name of remove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name });
            }
            const labels = [];
            if (handoff.nextRole) labels.push(`agent: ${handoff.nextRole}`);
            if (handoff.nextState) labels.push(`state: ${handoff.nextState}`);
            if (labels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels });
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                `<!-- CODEX_HANDOFF_ROUTED:v1 -->`,
                `Handoff `${handoff.handoffId}` routed successfully.`,
                handoff.nextRole ? `Next role: `${handoff.nextRole}`` : 'Next role: human review',
                handoff.nextState ? `State: `${handoff.nextState}`` : null,
                'GitHub Actions coordinated this handoff; no model or API token was invoked.'
              ].filter(Boolean).join('\n')
            });
