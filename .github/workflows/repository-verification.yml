name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-verification:
    name: Repository-wide verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pdf.txt
            requirements-tpt-visual.txt
      - name: Prepare the shared temporary workspace
        run: sudo mkdir -p /private/tmp && sudo chmod 1777 /private/tmp
      - name: Install Python PDF and visual dependencies
        run: python -m pip install --requirement requirements-pdf.txt --requirement requirements-tpt-visual.txt
      - name: Install PDF rasterization tool
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install locked dependencies
        run: npm ci
      - name: Install the Playwright browser used by render checks
        run: npx playwright install --with-deps chromium
      - name: Run the complete test suite
        run: npm test
      - name: Run visual and PDF verification
        run: npm run verification:visual-pdf
      - name: Run governance invariants
        run: npm run governance:validate
