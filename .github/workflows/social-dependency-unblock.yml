name: Unblock social workstream dependencies

on:
  issues:
    types: [closed]

permissions:
  issues: write

concurrency:
  group: issue-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unblock:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            const body = context.payload.issue.body || '';
            const month = body.match(/<!-- codex-social-monthly:([^:]+):(reel|carousel):(\d+) -->/);
            const utility = body.match(/<!-- codex-social-utility:([^:]+):week:(\d+) -->/);
            let marker = null;
            if (month?.[2] === 'reel') marker = `<!-- codex-social-monthly:${month[1]}:carousel:${month[3]} -->`;
            if (utility) marker = `<!-- codex-social-utility:${utility[1]}:week:${Number(utility[2]) + 1} -->`;
            if (!marker) { core.info('Closed Issue is not a social dependency producer.'); return; }
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const dependent = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            if (!dependent) { core.info(`No open dependent Issue found for ${marker}.`); return; }
            const current = dependent.labels.map(label => typeof label === 'string' ? label : label.name);
            const owners = current.filter(label => label.startsWith('agent: '));
            if (owners.length > 1) throw new Error(`Cannot atomically ready #${dependent.number}: multiple owners ${owners.join(', ')}`);
            const next = current.filter(label => label !== 'status:blocked' && label !== 'status: blocked');
            if (owners.length === 0) next.push('agent: social-expert');
            if (!next.includes('status: ready to pickup')) next.push('status: ready to pickup');
            await transitionIssueState({ github, owner: context.repo.owner, repo: context.repo.repo, issueNumber: dependent.number, expectedLabels: current, nextLabels: [...new Set(next)], body: dependent.body || '', commentBody: `Dependency #${context.payload.issue.number} closed. This social workstream Issue is now ready for Codex pickup after the normal PR and QA gates.`, commentFingerprint: `Dependency #${context.payload.issue.number} closed.` });
