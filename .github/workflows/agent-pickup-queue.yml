name: Announce governance intake and next agent pickup

on:
  issues:
    types: [opened, labeled, closed]

permissions:
  issues: write
  contents: read

concurrency:
  group: agent-pickup-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  announce-next:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and announce verified governance candidates
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const audit = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/pm-triage-audit.mjs`).href);
            const intake = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/agent-intake-comment.mjs`).href);
            const candidates = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100, sort: 'created', direction: 'asc' });
            const pullRequests = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100, sort: 'created', direction: 'asc' });
            const queueIssues = candidates.filter((item) => !item.pull_request).map((item) => ({
              ...item,
              pullRequests: pullRequests.filter((pr) => (pr.body || '').includes(`#${item.number}`) || (item.body || '').includes(`pull/${pr.number}`)),
            }));
            const auditResult = audit.auditQueue(queueIssues, pullRequests.filter((pr) => pr.state === 'open'));
            const queue = auditResult.executionPlan;

            const existing = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, per_page: 100 });
            const format = (items, label) => items.length ? `### ${label}\n${items.map(item => `- #${item.number} (${item.role}) — ${item.nextAction}`).join('\n')}` : `### ${label}\n- None`;
            const body = `CODEX_AGENT_INTAKE\n\nAuthoritative queue audit consumed by executor after Issue #${context.payload.issue.number} changed:\n\n${format(queue.pmIntake, 'PM triage intake')}\n\n${format(queue.developerPickup, 'Developer pickup (all checks passed)')}\n\nPlan fingerprint: ${queue.fingerprint}\n\n${audit.renderAuditComment(auditResult)}\n\nEvery open Issue is represented in the audit diagnostics above. No candidate is inferred outside this result.`;
            const plan = intake.intakeCommentPlan(existing, context.payload.issue.number, body);
            if (plan.action === 'noop') return core.info(`Governance intake fingerprint ${intake.agentIntakeFingerprint(context.payload.issue.number)} is unchanged.`);
            if (plan.action === 'update') {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: plan.commentId, body: plan.body });
              return core.info(`Updated the existing governance intake comment for Issue #${context.payload.issue.number}; no duplicate created.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: plan.body
            });
