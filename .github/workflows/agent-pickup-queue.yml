name: Announce next agent pickup

on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read

jobs:
  announce-next:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Find and announce the next ready Issue
        uses: actions/github-script@v7
        with:
          script: |
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:open label:"status: ready to pickup" -label:"status: blocked"`;
            const result = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q,
              per_page: 100,
              sort: 'created',
              order: 'asc'
            });
            const candidates = result.filter(item => !item.pull_request);

            if (!candidates.length) {
              core.info('No open, unblocked Issue is ready for pickup.');
              return;
            }

            const marker = '<!-- codex-agent-pickup -->';
            const list = candidates.map(item => `- #${item.number} ${item.title} — ${item.html_url}`).join('\n');
            const body = `${marker}\nCODEX_AGENT_PICKUP\n\nEligible pickup queue after #${context.payload.issue.number} closed:\n\n${list}\n\nThe agent must determine execution order from the full Issue context and project dependencies. Requires \`status: ready to pickup\`; excludes \`status: blocked\`.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
