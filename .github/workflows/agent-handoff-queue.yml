name: Queue agent handoff

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  queue:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Check out routing contract
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deterministic handoff plan
        run: node scripts/build-agent-handoff-plan.mjs --event "$GITHUB_EVENT_PATH" --output /tmp/agent-handoff-plan.json

      - name: Post one idempotent handoff queue record
        uses: actions/github-script@v7
        env:
          PLAN_PATH: /tmp/agent-handoff-plan.json
        with:
          script: |
            const fs = require('node:fs');
            const { plan } = JSON.parse(fs.readFileSync(process.env.PLAN_PATH, 'utf8'));
            if (!plan) {
              core.info(`No agent handoff route for label ${context.payload.label.name}.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: plan.issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(plan.marker))) {
              core.info(`Handoff already exists for ${plan.marker}.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: plan.issueNumber,
              labels: plan.addLabels,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: plan.issueNumber,
              body: plan.body,
            });
