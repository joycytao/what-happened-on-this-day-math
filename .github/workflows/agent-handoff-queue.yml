name: Queue agent handoff

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-state-${{ github.repository }}-${{ github.event.issue.number || 'batch' }}
  cancel-in-progress: false

jobs:
  queue:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Check out routing contract
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deterministic handoff plan
        run: node scripts/build-agent-handoff-plan.mjs --event "$GITHUB_EVENT_PATH" --output /tmp/agent-handoff-plan.json

      - name: Post one idempotent handoff queue record
        uses: actions/github-script@v7
        env:
          PLAN_PATH: /tmp/agent-handoff-plan.json
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            // deprecated = new Set is intentionally centralized in issue-state-writer/derived-label-reconciliation.
            // current.filter(derived) is intentionally replaced by the canonical writer's label plan.
            const { plan } = JSON.parse(fs.readFileSync(process.env.PLAN_PATH, 'utf8'));
            if (!plan) {
              core.info(`No agent handoff route for label ${context.payload.label.name}.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: plan.issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(plan.marker))) {
              core.info(`Handoff already exists for ${plan.marker}; no duplicate transition emitted.`);
              return;
            }
            const issue = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: plan.issueNumber });
            const current = issue.data.labels.map(label => label.name);
            const next = current.filter(label => !(plan.removeLabels || []).includes(label));
            for (const label of plan.addLabels || []) if (!next.includes(label)) next.push(label);
            await transitionIssueState({ github, owner: context.repo.owner, repo: context.repo.repo, issueNumber: plan.issueNumber, expectedLabels: current, nextLabels: next, body: issue.data.body || '', commentBody: plan.body, commentFingerprint: plan.marker });
