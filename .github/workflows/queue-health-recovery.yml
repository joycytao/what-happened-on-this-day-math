name: Queue health recovery

on:
  workflow_run:
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  recover:
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const health = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/queue-health-recovery.mjs`).href);
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const prRefs = run.pull_requests || [];
            if (!prRefs.length) {
              core.notice(`Failed workflow run #${run.id} has no pull-request linkage; no role recovery was guessed.`);
              return;
            }
            const issueNumbers = new Set();
            for (const ref of prRefs) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: ref.number });
              for (const match of (pr.data.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:(?:[^\s/]+)\/[^\s#]+)?#(\d+)/gi)) issueNumbers.add(Number(match[1]));
            }
            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const result = health.auditQueueHealth({
                ...issue.data,
                workflowRun: { id: run.id, conclusion: run.conclusion, name: run.name, workflowName: run.name, url: run.html_url },
              });
              const marker = `<!-- CODEX_WORKFLOW_FAILURE_RECOVERY:${issueNumber}:${run.id} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
              if (comments.some((comment) => (comment.body || '').includes(marker))) continue;
              if (result.repair.add.length || result.repair.remove.length) {
                const current = issue.data.labels.map((label) => label.name);
                const next = current.filter((label) => !result.repair.remove.includes(label));
                for (const label of result.repair.add) if (!next.includes(label)) next.push(label);
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, labels: next });
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: `${marker}\nCODEX_WORKFLOW_FAILURE_RECOVERY:v1\n\n- Workflow run: ${run.html_url}\n- Conclusion: ${run.conclusion}\n- Health category: ${result.category}\n- Next role: ${result.nextRole || 'pm-triage required'}\n- Action: ${result.action}\n- Evidence: ${result.evidence.join('; ') || 'none'}\n- Blockers: ${result.blockers.join('; ') || 'none'}\n- No role was inferred when the workflow evidence was ambiguous.` });
            }
