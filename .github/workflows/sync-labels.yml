name: Sync issue labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update shared labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ['type: bug', 'd73a4a', 'Something is not working as expected'],
              ['type: feature', 'a2eeef', 'A request for new or improved functionality'],
              ['type: documentation', '0075ca', 'Documentation changes or improvements'],
              ['content:monthly', '1d76db', 'Monthly content source filter'],
              ['status: blocked', 'e4e669', 'Cannot proceed until a dependency or decision is resolved'],
              ['status: pending review', 'fbca04', 'Waiting for review or triage'],
              ['status: ready to pickup', '0e8a16', 'Approved and ready for an agent to pick up'],
              ['status: qa', 'fbca04', 'Implementation is complete and waiting for QA evidence'],
              ['status: paused', '6f6b66', 'Intentionally deferred by an explicit priority decision'],
              ['status: ready to dispatch', '0e8a16', 'QA passed; downstream dispatch still needs human approval'],
              ['status: done', '0e8a16', 'Work is complete'],
              ['ready-for-human', '5319e7', 'A specific human decision or approval is required'],
              ['state: decision-requested', 'c5def5', 'A named domain owner must answer an open decision'],
              ['state: implementation', '0e8a16', 'Implementation is in progress'],
              ['state: changes-requested', 'd93f0b', 'QA requested a concrete implementation change'],
              ['agent: pm-triage', '7057ff', 'PM triage owns routing and completeness'],
              ['agent: product-manager', '1d76db', 'Product Manager owns the open product decision'],
              ['agent: architect', '5319e7', 'Architect owns the open technical decision'],
              ['agent: social-expert', 'fbca04', 'Social expert owns the open channel decision'],
              ['agent: developer', '0e8a16', 'Developer owns implementation'],
              ['agent: quality-engineer', 'd4c5f9', 'Quality Engineer owns verification']
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
                await github.rest.issues.updateLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }
