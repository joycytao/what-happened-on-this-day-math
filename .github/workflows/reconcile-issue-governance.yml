name: Reconcile issue governance

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  repository_dispatch:
    types: [dependency-closed, source-asset-available, dependency-reconcile]
  push:
    paths:
      - "assets/**"
      - "content/**"
      - "data/**"
      - "history_today_*.csv"
  workflow_run:
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != github.workflow || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const governance = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-governance.mjs`).href);
            const recovery = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/dependency-recovery.mjs`).href);
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            const event = recovery.parseDependencyEvent({ eventName: context.eventName, payload: context.payload });
            if (!event.valid) {
              core.warning(`Dependency recovery event was ignored: ${event.errors.join('; ')}`);
              return;
            }
            const all = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100 });
            for (const issue of all.filter(item => !item.pull_request && item.state === 'open')) {
              const contract = governance.parseIssueContract(issue);
              const plan = recovery.dependencyRecoveryPlan(issue, all, event);
              if (plan.action !== 'transition') continue;
              await transitionIssueState({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: issue.number,
                expectedLabels: issue.labels.map(label => label.name),
                nextLabels: plan.labels,
                body: issue.body || '',
                commentBody: recovery.renderDependencyRecoveryComment({ issue: issue.number, event, target: plan.target, reason: plan.reason, report: plan.report }),
                commentFingerprint: `<!-- CODEX_DEPENDENCY_RECOVERY:${issue.number}:${event.eventId}:${plan.target} -->`,
              });
            }
