name: Unblock dependent work

on:
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: issue-state-dependency-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  unblock:
    if: contains(github.event.issue.body, 'CODEX_DEPENDENCY_FOR:') && contains(github.event.issue.body, 'CODEX_BLOCKED_PR:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocked labels from dependent work
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { transitionIssueState } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/issue-state-writer.mjs`).href);
            const body = context.payload.issue.body || '';
            const issueRef = body.match(/CODEX_DEPENDENCY_FOR:\s*([^\s#]+\/[^\s#]+)#(\d+)/);
            const prRef = body.match(/CODEX_BLOCKED_PR:\s*([^\s#]+\/[^\s#]+)#(\d+)/);
            if (!issueRef || !prRef || issueRef[1] !== `${context.repo.owner}/${context.repo.repo}` || prRef[1] !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Dependency markers are missing or point to another repository.');
              return;
            }

            const noticeBody = `Dependency #${context.payload.issue.number} was closed. Removed \`status: blocked\` from this Issue and PR #${prRef[2]}. PM triage must re-check inputs, dependencies, and any human-only gate before marking this Issue \`status: ready to pickup\`.`;
            for (const issue_number of [Number(issueRef[2]), Number(prRef[2])]) {
              const issue = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
              const current = issue.data.labels.map(label => label.name);
              await transitionIssueState({ github, owner: context.repo.owner, repo: context.repo.repo, issueNumber: issue_number, expectedLabels: current, nextLabels: current.filter(label => label !== 'status: blocked'), body: issue.data.body || '', commentBody: noticeBody, commentFingerprint: `Dependency #${context.payload.issue.number} was closed.` });
            }
