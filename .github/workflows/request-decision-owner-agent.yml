name: Request Decision Owner agent

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  request-agent:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.label.name == 'decision-owner: architect' ||
      github.event.label.name == 'decision-owner: product-manager')
    runs-on: ubuntu-latest
    steps:
      - name: Generate a manual agent request
        uses: actions/github-script@v7
        with:
          script: |
            const roleToSkill = {
              'decision-owner: architect': {
                role: 'architect',
                skill: 'skills/architect/SKILL.md'
              },
              'decision-owner: product-manager': {
                role: 'product-manager',
                skill: 'skills/product-manager/SKILL.md'
              }
            };

            const decisionLabel = context.payload.label.name;
            const config = roleToSkill[decisionLabel];
            if (!config) {
              core.info(`Ignoring unsupported label: ${decisionLabel}`);
              return;
            }

            const issueNumber = context.issue.number;
            const marker = `<!-- codex-agent-request:${issueNumber}:${config.role} -->`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              }
            );

            if (comments.some(comment => (comment.body || '').includes(marker))) {
              core.info(`A ${config.role} request already exists for #${issueNumber}.`);
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['agent-requested']
              });
            } catch (error) {
              if (![404, 422].includes(error.status)) throw error;
              core.warning('agent-requested label is not synced; continuing with the request comment.');
            }

            const issueUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}`;
            const prompt = [
              `Use the \`${config.role}\` skill.`,
              `Read Issue #${issueNumber} in full, including dependencies and recent comments.`,
              `Answer only the open questions whose Decision Owner is \`${config.role}\`.`,
              `Read \`${config.skill}\`, \`docs/agent-governance.md\`, and \`skills/pm-triage/SKILL.md\`.`,
              'Return the required Decision record with conclusion, evidence, impact, verification, consulted roles, and blocking status.',
              'Do not change Issue labels and do not mark the Issue `status: ready to pickup`.'
            ].join('\n');

            const body = `${marker}
            CODEX_AGENT_REQUEST

            A manual ${config.role} request is ready for this Issue.

            - Issue: [#${issueNumber}](${issueUrl})
            - Decision Owner role: \`${config.role}\`
            - Skill: \`${config.skill}\`
            - Execution: manual — this workflow does not run Codex or answer the question automatically.

            Copy this prompt into Codex or the configured agent runner:

            \`\`\`text
            ${prompt}
            \`\`\`

            After the agent answers, have \`pm-triage\` record the Decision and update the Issue.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
