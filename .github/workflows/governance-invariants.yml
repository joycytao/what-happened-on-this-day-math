name: Governance invariants

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/validate-*.mjs'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/validate-*.mjs'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run governance:validate
      - run: node --test tests/github-script-syntax.test.mjs tests/monthly-release-approval.test.mjs
      - run: node --test tests/issue-governance.test.mjs tests/monthly-production-orchestration.test.mjs
