name: Governance invariants

on:
  push:
    paths: ['src/issue-governance.mjs', 'src/pm-triage-contract.mjs', 'src/pm-triage-audit.mjs', 'src/pm-triage-audit-contract.mjs', 'src/product-manager-contract.mjs', 'src/developer-contract.mjs', 'src/quality-engineer-contract.mjs', 'src/human-review-policy.mjs', 'src/monthly-release-identity.mjs', 'src/monthly-release-approval.mjs', 'scripts/validate-issue-governance.mjs', 'scripts/validate-github-scripts.mjs', 'scripts/validate-pm-triage.mjs', 'scripts/validate-pm-triage-audit.mjs', 'scripts/validate-product-manager.mjs', 'scripts/validate-developer.mjs', 'scripts/validate-quality-engineer.mjs', 'scripts/validate-human-review-policy.mjs', 'tests/pm-triage-contract.test.mjs', 'tests/pm-triage-audit.test.mjs', 'tests/pm-triage-audit-contract.test.mjs', 'tests/product-manager-contract.test.mjs', 'tests/developer-contract.test.mjs', 'tests/quality-engineer-contract.test.mjs', 'tests/human-review-policy.test.mjs', 'tests/issue-governance.test.mjs', 'tests/monthly-release-approval.test.mjs', 'tests/github-script-syntax.test.mjs', 'tests/fixtures/issue-governance-fixtures.json', '.github/workflows/**', 'package.json']
  pull_request:
    paths: ['src/issue-governance.mjs', 'src/pm-triage-contract.mjs', 'src/pm-triage-audit.mjs', 'src/pm-triage-audit-contract.mjs', 'src/product-manager-contract.mjs', 'src/developer-contract.mjs', 'src/quality-engineer-contract.mjs', 'src/human-review-policy.mjs', 'scripts/validate-issue-governance.mjs', 'scripts/validate-github-scripts.mjs', 'scripts/validate-pm-triage.mjs', 'scripts/validate-pm-triage-audit.mjs', 'scripts/validate-product-manager.mjs', 'scripts/validate-developer.mjs', 'scripts/validate-quality-engineer.mjs', 'scripts/validate-human-review-policy.mjs', 'tests/pm-triage-contract.test.mjs', 'tests/pm-triage-audit.test.mjs', 'tests/pm-triage-audit-contract.test.mjs', 'tests/product-manager-contract.test.mjs', 'tests/developer-contract.test.mjs', 'tests/quality-engineer-contract.test.mjs', 'tests/human-review-policy.test.mjs', 'tests/issue-governance.test.mjs', 'tests/fixtures/issue-governance-fixtures.json', '.github/workflows/**', 'package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run governance:validate
      - run: node --test tests/github-script-syntax.test.mjs tests/monthly-release-approval.test.mjs
      - run: node --test tests/issue-governance.test.mjs tests/monthly-production-orchestration.test.mjs
